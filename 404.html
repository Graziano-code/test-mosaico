<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops! Pagina non trovata - A Piccoli Passi APS</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <link rel="preload" href="fonts/titilliumweb-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/titilliumweb-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    
    <style>
        /* FONT SELF-HOSTED IN LOCALE */
        @font-face {
            font-family: 'Caveat';
            font-style: normal;
            font-weight: 700;
            font-display: optional;
            src: url('fonts/caveat-700-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Titillium Web';
            font-style: normal;
            font-weight: 400;
            font-display: optional;
            src: url('fonts/titilliumweb-400-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Titillium Web';
            font-style: normal;
            font-weight: 700;
            font-display: optional;
            src: url('fonts/titilliumweb-700-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --c-forest: #2d5a27;
            --c-primary: #3d792b;
            --c-orange: #c54316;
            --c-blue: #1d70b8;
            --c-bg: #fdfbf7;
            --font-main: "Titillium Web", system-ui, sans-serif;
            --font-script: "Caveat", cursive;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            background-color: var(--c-bg);
            background-image: radial-gradient(#dbe8d2 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            color: var(--c-forest);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 1.5rem;
        }
        .error-container {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            padding: 2.5rem 1.75rem;
            border-radius: 20px;
            border: 3px solid var(--c-primary);
            box-shadow: 0 12px 28px rgba(45, 90, 39, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .error-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--c-primary);
            margin-bottom: 1rem;
            object-fit: contain;
        }
        h1 {
            font-size: 5rem;
            color: var(--c-orange);
            line-height: 1;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }
        h2 {
            font-size: 1.85rem;
            color: var(--c-forest);
            margin-bottom: 1rem;
        }
        .error-motto {
            font-family: var(--font-script);
            font-size: 1.8rem;
            color: var(--c-primary);
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.05rem;
            color: #51636d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--c-primary);
            color: #ffffff;
            text-decoration: none;
            padding: 0.9rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1.05rem;
            min-height: 48px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 12px rgba(61, 121, 43, 0.25);
        }
        .btn:hover {
            background: var(--c-forest);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <picture>
            <source srcset="images/logo-trasparente.webp?v=3" type="image/webp">
            <img src="images/logo-trasparente.png?v=3" alt="A Piccoli Passi APS" class="error-logo" width="64" height="64">
        </picture>
        <h1>404</h1>
        <h2>Fuori dal sentiero!</h2>
        <span class="error-motto">Insieme, un passo alla volta.</span>
        <p>Sembra che tu abbia fatto un piccolo passo nella direzione sbagliata. La pagina che stai cercando non esiste o è stata spostata.</p>
        <a href="./" class="btn">Torna alla Home</a>
    </div>
</body>
</html>
